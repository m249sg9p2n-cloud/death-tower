function stats(){let hp=(100+30*s.level.hp)*(1+bonus('hp')*.01),atk=(12+5*s.level.atk)*(1+bonus('atk')*.01),def=(2+2*s.level.def)*(1+bonus('def')*.01);return {hp:Math.floor(hp),atk:Math.floor(atk),def:Math.floor(def),crit:clamp(.05+bonus('crit')*.003,0,.7),critd:1.5+bonus('critd')*.015,speed:clamp(1+bonus('speed')*.015,1,3.5)}}
const MONSTERS=[['🦠','スライム'],['🐺','魔狼'],['💀','骸骨兵'],['🧙','魔導士'],['👻','亡霊'],['🗿','巨人'],['🐉','竜'],['👹','鬼'],['🦂','魔蠍'],['🦇','吸血獣'],['🦑','深淵獣'],['⚔️','魔騎士']];
function enemyAt(f){let tier=Math.floor((f-1)/25),type=Math.floor((f-1)/5)%MONSTERS.length,boss=f%10===0;let power=Math.pow(1.035,Math.min(f-1,100))*Math.pow(1.019,Math.max(0,f-101));power=Math.min(power,1e130);let hp=Math.max(30,Math.min(1e140,Math.floor((60+f*5)*power*(boss?4:1)))),atk=Math.max(2,Math.floor((5+f*.55)*Math.pow(power,.72)*(boss?1.7:1))),def=Math.floor((f*.16)*Math.pow(power,.25));return {f,hp,maxHp:hp,atk,def,emoji:boss?'🐲':MONSTERS[type][0],name:(tier>=20?'神域の':tier>=12?'深淵の':tier>=4?'覚醒した':'')+(boss?'階層守護竜':MONSTERS[type][1]),level:f+Math.floor(f/25)*5,boss}}
function spawn(){enemy=enemyAt(s.floor);s.hp=clamp(s.hp,1,stats().hp)}
function upgradeCost(k){let l=s.level[k];return Math.floor(({hp:18,atk:22,def:18}[k])*Math.pow(1.23,l))}
function upgrade(k){let cost=upgradeCost(k);if(s.souls<cost)return;s.souls-=cost;s.level[k]++;if(k==='hp')s.hp=Math.min(stats().hp,s.hp+30);sound(950,.1);save();draw();if(panel==='upgrade')renderPanel()}
function dealPlayer(){if(!enemy)return;let st=stats(),crit=Math.random()<st.crit,base=Math.max(1,st.atk-enemy.def*.55),dmg=Math.floor(base*(crit?st.critd:1)*(1+bonus('first')*.01*(enemy.hp===enemy.maxHp?1:0)));if(Math.random()<clamp(bonus('execute')*.001,0,.35)&&enemy.hp<enemy.maxHp*.25)dmg=enemy.hp;enemy.hp=Math.max(0,enemy.hp-dmg);s.damageRecord=Math.max(s.damageRecord,dmg);s.hp=Math.min(st.hp,s.hp+Math.floor(dmg*clamp(bonus('leech')*.001,0,.2)));flash('enemy');floating((crit?'CRIT ':'')+fmt(dmg));if(enemy.hp<=0){win();return}if(Math.random()<clamp(bonus('double')*.004+bonus('combo')*.003+bonus('smite')*.001,0,.65)){let extra=Math.floor(dmg*(.35+bonus('smite')*.002));enemy.hp=Math.max(0,enemy.hp-extra);if(enemy.hp<=0)win()}}
function dealEnemy(){if(!enemy)return;let st=stats();if(Math.random()<clamp(bonus('dodge')*.002,0,.35))return;let dmg=Math.max(1,Math.floor(enemy.atk-st.def*(1+bonus('shield')*.01)));if(Math.random()<clamp(bonus('freeze')*.002,0,.2))return;s.hp=Math.max(0,s.hp-dmg);if(bonus('reflect'))enemy.hp=Math.max(1,enemy.hp-Math.floor(dmg*clamp(bonus('reflect')*.003,0,.3)));flash('hero');if(s.hp<=0){if(!enemy.revived&&Math.random()<clamp(bonus('revive')*.003,0,.65)){enemy.revived=true;s.hp=Math.max(1,Math.floor(st.hp*.3));notice('奇跡の復活！')}else death()}}
function chestMilestone(f){if(f%25!==0)return [];let min=f>=500?4:f>=300?3:f>=200?2:f>=125?1:0;let count=f%100===0?3:f%50===0?2:1;return Array.from({length:count},(_,i)=>({min:f===100&&i<2?0:min,source:f+'F 踏破報酬'}))}
function win(){let f=s.floor;s.kills++;let gain=Math.max(1,Math.floor((5+f*.8)*(1+bonus('soul')*.01+bonus('soulDragon')*.01)));if(Math.random()<clamp(bonus('soulDouble')*.003,0,.6))gain*=2;s.souls+=gain;s.totalSouls+=gain;let milestone=chestMilestone(f);s.pendingChests.push(...milestone);if(Math.random()<clamp(.045+bonus('chest')*.0008,0,.2))s.pendingChests.push({min:0,source:'敵ドロップ'});s.floor++;s.best=Math.max(s.best,s.floor);s.hp=Math.min(stats().hp,s.hp+Math.max(5,Math.floor(stats().hp*.15+bonus('regen'))));spawn();if(milestone.length)notice(f+'F突破！ 宝箱 '+milestone.length+'個獲得');if([100,300,500].includes(f)){titleUpdate();notice('タイトル画面が進化しました！');sound(1100,.3)}save()}
function death(){s.paused=true;save();openPanel('death')}
function rebirth(){let f=s.floor;let earned=Math.floor(Math.max(0,f-1)*Math.sqrt(Math.max(0,f-1))*.4*(1+bonus('rebirthSoul')*.01+bonus('soulDragon')*.005));s.rebirth++;s.souls+=earned;s.totalSouls+=earned;s.floor=1;s.level={hp:0,atk:0,def:0};s.hp=stats().hp;s.paused=false;spawn();save();closePanel();notice('転生完了！ +'+fmt(earned)+' SOUL');draw()}
function openChest(){if(!s.pendingChests.length)return;let box=s.pendingChests.shift(),roll=Math.random()*100,r=roll<55?0:roll<83?1:roll<95?2:roll<99?3:4;r=Math.max(r,box.min||0);let pool=RELICS.filter(x=>x.r===r),chosen=pool[Math.floor(Math.random()*pool.length)],old=levelOf(chosen.id);if(old<10)s.relics[chosen.id]=old+1;else{s.souls+=200*(r+1);s.totalSouls+=200*(r+1)}s.chestsOpened++;save();sound(800+r*130,.2);notice((old>=10?'MAX変換: ':'GET: ')+chosen.name+' ['+RARITY[r]+']');if(panel==='chest')renderPanel()}
function togglePause(){s.paused=!s.paused;save();draw()}
function setSpeed(v){s.speed=v;save();draw()}
function flash(id){let el=document.getElementById(id);el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),120)}
function floating(t){let el=document.createElement('div');el.className='float';el.textContent=t;document.getElementById('damageLayer').replaceChildren(el);setTimeout(()=>el.remove(),600)}
function draw(){let st=stats();document.getElementById('floorHud').textContent=fmt(s.floor)+' F';document.getElementById('soulHud').textContent=fmt(s.souls);document.getElementById('floorInfo').textContent='FLOOR '+fmt(s.floor)+(enemy.boss?' ⚠ BOSS':'');document.getElementById('enemyInfo').textContent=enemy.name+' Lv.'+fmt(enemy.level);document.getElementById('enemy').textContent=enemy.emoji;document.getElementById('nextEnemy').textContent=enemyAt(s.floor+1).emoji;document.getElementById('nextInfo').textContent='FLOOR '+fmt(s.floor+1);document.getElementById('hpInfo').textContent='HP '+fmt(s.hp)+' / '+fmt(st.hp);document.getElementById('enemyHpInfo').textContent='ENEMY '+fmt(enemy.hp)+' / '+fmt(enemy.maxHp);document.getElementById('hpBar').style.width=clamp(s.hp/st.hp*100,0,100)+'%';document.getElementById('enemyBar').style.width=clamp(enemy.hp/enemy.maxHp*100,0,100)+'%';document.getElementById('atkInfo').textContent=fmt(st.atk);document.getElementById('defInfo').textContent=fmt(st.def);document.getElementById('critInfo').textContent=(st.crit*100).toFixed(1)+'%';document.getElementById('maxHpInfo').textContent=fmt(st.hp);document.getElementById('bestInfo').textContent=fmt(s.best)+'F';document.getElementById('rebirthInfo').textContent=fmt(s.rebirth);document.getElementById('pauseBtn').textContent=s.paused?'▶ 再開':'⏸ 停止';for(let v of [1,2,5])document.getElementById('speed'+v).classList.toggle('active',s.speed===v);document.getElementById('missionDot').textContent=MISSIONS.some(m=>ready(m))||REPEATS.some(m=>repeatReady(m))?' 🔴':''}
function loop(t){let dt=Math.min(.2,(t-lastTick)/1000);lastTick=t;if(started&&!panel&&!s.paused){fightClock+=dt*s.speed*stats().speed;let steps=0;while(fightClock>=1&&steps++<8){fightClock-=1;dealPlayer();if(!enemy||s.paused)break;dealEnemy()}}if(t-lastSave>250){draw();lastSave=t}requestAnimationFrame(loop)}
function closePanel(){panel='';document.getElementById('overlay').classList.add('hidden');draw()}
function openPanel(name){panel=name;document.getElementById('overlay').classList.remove('hidden');renderPanel()}
const MISSIONS=[...([10,25,50,100,125,200,300,500,1000,2000,5000].map(f=>({id:'f'+f,name:f+'階の踏破者',desc:f+'階に到達',type:'best',goal:f,reward:f>=500?{chest:Math.min(4,Math.floor(f/500)+2)}:f>=100?{chest:f>=200?2:1}:{soul:f*10}}))),...([1,5,10,25,50,100].map(n=>({id:'r'+n,name:'輪廻の旅人 '+n,desc:'累計'+n+'回転生',type:'rebirth',goal:n,reward:n>=10?{chest:1}:{soul:n*150}}))),...([100,500,1000,5000,10000,100000].map(n=>({id:'k'+n,name:'討伐者 '+fmt(n),desc:'累計'+fmt(n)+'体撃破',type:'kills',goal:n,reward:n>=10000?{chest:2}:{soul:Math.floor(n*.6)}}))),...([10,30,60,100].map(n=>({id:'c'+n,name:'遺物の探求者 '+n,desc:'レリックを'+n+'種類発見',type:'owned',goal:n,reward:n>=60?{chest:2}:{soul:n*50}})))];
const REPEATS=[{id:'kills',name:'討伐の記録',type:'kills',goals:[100,300,1000,2000,5000,10000]},{id:'rebirth',name:'輪廻の記録',type:'rebirth',goals:[1,3,5,10,20,50]},{id:'chestsOpened',name:'宝箱の記録',type:'chestsOpened',goals:[5,15,30,50,100,200]}];
function progress(type){return type==='owned'?Object.values(s.relics).filter(n=>n>0).length:s[type]||0}
function ready(m){return !s.claims[m.id]&&progress(m.type)>=m.goal}
function claim(m){if(!ready(m))return;s.claims[m.id]=true;reward(m.reward);save();renderPanel()}
function reward(v){if(v.soul){s.souls+=v.soul;s.totalSouls+=v.soul;notice('ソウル +'+fmt(v.soul))}if(v.chest!==undefined){s.pendingChests.push({min:v.chest,source:'実績報酬'});notice(RARITY[v.chest]+'以上の宝箱を獲得！')}}
function repeatGoal(m,n){return m.goals[n]??Math.floor(m.goals.at(-1)*Math.pow(1.8,n-m.goals.length+1))}
function repeatReady(m){let n=s.repeatClaims[m.id]||0;return progress(m.type)>=repeatGoal(m,n)}
function claimRepeat(id){let m=REPEATS.find(x=>x.id===id);if(!m||!repeatReady(m))return;let n=s.repeatClaims[id]||0,goal=repeatGoal(m,n);s.repeatClaims[id]=n+1;reward(n>0&&n%9===0?{chest:Math.min(2,Math.floor(n/10))}:{soul:Math.max(100,Math.floor(Math.sqrt(goal)*45))});save();renderPanel()}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPanel(){const titles={upgrade:'魂の強化',relic:'レリック図鑑',mission:'実績・累計ミッション',rebirth:'輪廻の祭壇',death:'敗北',chest:'宝箱の間',menu:'冒険記録・設定',detail:'レリック詳細',import:'データ移行'};document.getElementById('panelTitle').textContent=titles[panel]||panel;let h='';if(panel==='upgrade'){h='<div class="notice">ソウルを消費して今回の冒険を強化。転生時に強化Lvはリセットされます。</div>';for(const [k,name,icon] of [['hp','最大HP','❤️'],['atk','攻撃力','⚔️'],['def','防御力','🛡️']]){let cost=upgradeCost(k);h+=`<div class="item line"><div>${icon} <b>${name} Lv.${s.level[k]}</b><p>次の強化: ${fmt(cost)} SOUL</p></div><button ${s.souls<cost?'disabled':''} onclick="upgrade('${k}')">強化</button></div>`}h+='<button onclick="openPanel(\'chest\')">🎁 宝箱を開ける ('+s.pendingChests.length+')</button>'}
else if(panel==='relic'){h='<div class="notice">全100種類・各レア20種類。重複入手で最大Lv.10まで成長します。タップして詳細とON/OFFを確認できます。</div><div class="relicgrid">';for(let r of RELICS){let lv=levelOf(r.id);h+=`<button style="border-color:${COLOR[r.r]};opacity:${lv?1:.42}" onclick="relicDetail(${r.id})">${['◇','◆','✦','✧','★'][r.r]}<span>${lv?'Lv.'+lv:'未発見'}</span></button>`}h+='</div><button onclick="openPanel(\'chest\')">宝箱の間へ ('+s.pendingChests.length+')</button>'}
else if(panel==='detail'){let r=RELICS[detailId],lv=levelOf(r.id);h=`<div class="item"><h3 style="color:${COLOR[r.r]}">${escapeHtml(r.name)}</h3><p>${RARITY[r.r]} · ${lv?'Lv.'+lv:'未発見'}/10</p><p>${escapeHtml(effectDesc(r))}</p><p>重複入手で基礎効果の22%ずつ増加。最大Lv.10。</p></div>`;if(lv)h+=`<button class="primary" onclick="toggleRelic(${r.id})">効果: ${s.disabled[r.id]?'OFF（タップでON）':'ON（タップでOFF）'}</button>`;h+='<button onclick="openPanel(\'relic\')">図鑑へ戻る</button>'}
else if(panel==='mission'){h='<div class="notice">報酬は自動付与されません。達成後「受け取る」をタップしてください。転生しても進捗と受取履歴は残ります。</div><h3>🏆 実績</h3>';for(const m of MISSIONS){let p=progress(m.type),done=!!s.claims[m.id];h+=`<div class="item"><div class="line"><b>${escapeHtml(m.name)}</b><span class="pill">${done?'受取済':p>=m.goal?'達成':'進行中'}</span></div><p>${m.desc} · ${fmt(Math.min(p,m.goal))}/${fmt(m.goal)}</p><div class="progress"><i style="width:${clamp(p/m.goal*100,0,100)}%"></i></div><div class="line"><span class="small">報酬 ${rewardText(m.reward)}</span><button ${done||p<m.goal?'disabled':''} onclick="claim(MISSIONS.find(x=>x.id==='${m.id}'))">${done?'受取済':'受け取る'}</button></div></div>`}h+='<h3>♾️ 累計ミッション</h3>';for(let m of REPEATS){let n=s.repeatClaims[m.id]||0,goal=repeatGoal(m,n),p=progress(m.type);h+=`<div class="item"><div class="line"><b>${m.name}</b><span class="pill">STAGE ${n+1}</span></div><p>${fmt(Math.min(p,goal))} / ${fmt(goal)}</p><div class="progress"><i style="width:${clamp(p/goal*100,0,100)}%"></i></div><div class="line"><span class="small">次の報酬 ${n>0&&n%9===0?'宝箱':'ソウル'}</span><button ${p<goal?'disabled':''} onclick="claimRepeat('${m.id}')">受け取る</button></div></div>`}}
else if(panel==='rebirth'||panel==='death'){let gain=Math.floor(Math.max(0,s.floor-1)*Math.sqrt(Math.max(0,s.floor-1))*.4*(1+bonus('rebirthSoul')*.01+bonus('soulDragon')*.005));h=`<div class="item"><h3>${panel==='death'?'倒されました':'好きなタイミングで転生できます'}</h3><p>現在 ${fmt(s.floor)}階 · 最高 ${fmt(s.best)}階</p><p>転生報酬 <b class="gold">+${fmt(gain)} SOUL</b></p><p>転生で階層・強化Lv・現在HPをリセット。レリック・所持ソウル・実績・最高到達階は維持します。</p></div><button class="primary" onclick="rebirth()">🔄 転生する</button>`;if(panel==='death')h+='<div class="notice">再開するには転生してください。</div>'}
else if(panel==='chest'){h=`<div class="item"><h3>未開封宝箱 ${s.pendingChests.length}個</h3><p>フロアの節目・敵ドロップ・実績報酬で獲得。最低レア保証つきの宝箱もあります。</p></div>`;if(s.pendingChests.length){let box=s.pendingChests[0];h+=`<div class="item"><b class="gold">🎁 ${RARITY[box.min||0]}以上</b><p>${escapeHtml(box.source||'宝箱')}</p></div><button class="primary" onclick="openChest()">✨ 宝箱を開封する</button>`}else h+='<div class="notice">未開封の宝箱はありません。</div>';h+='<button onclick="openPanel(\'relic\')">レリック図鑑を見る</button>'}
else if(panel==='menu'){h=`<div class="item"><h3>冒険記録</h3><p>最高到達階: ${fmt(s.best)} F</p><p>現在階層: ${fmt(s.floor)} F / 転生: ${fmt(s.rebirth)} 回</p><p>累計討伐: ${fmt(s.kills)} 体</p><p>累計獲得ソウル: ${fmt(s.totalSouls)}</p><p>宝箱開封: ${fmt(s.chestsOpened)} 個</p><p>最大ダメージ: ${fmt(s.damageRecord)}</p><p>レリック発見: ${progress('owned')} / 100</p><p>タイトル進化: ${s.best>=500?'神域':s.best>=300?'冥炎':s.best>=100?'紅雷':'始まり'}</p></div><div class="item"><h3>設定</h3><p>BGM <span id="bgmVal">${s.settings.bgm}%</span></p><input type="range" min="0" max="100" value="${s.settings.bgm}" oninput="s.settings.bgm=+this.value;save();document.getElementById('bgmVal').textContent=this.value+'%'" style="width:100%"><p>効果音 ${s.settings.se}%</p><input type="range" min="0" max="100" value="${s.settings.se}" oninput="s.settings.se=+this.value;save();this.previousElementSibling.textContent='効果音 '+this.value+'%'" style="width:100%"><p class="notice">BGMはオリジナルのシンセサウンドです。iPhoneではタップ後に再生されます。</p></div><button onclick="openPanel('chest')">🎁 宝箱 (${s.pendingChests.length})</button><button onclick="exportSave()">💾 バックアップを書き出す</button><button onclick="document.getElementById('fileInput').click()">📥 バックアップを読み込む</button><input id="fileInput" class="hidden" type="file" accept=".json,application/json" onchange="importFile(this)"><button onclick="showTitle()">タイトル画面に戻る</button><button onclick="resetGame()">⚠ セーブデータを初期化</button>`}
else if(panel==='import')h='<div class="notice">Ver.5のセーブ形式は実データ構造を照合してからの変換が必要です。Ver.6のバックアップは読み込めます。</div>';
document.getElementById('panelBody').innerHTML=h}

function effectDesc(r){let [name,mul,unit]=effectRules[r.kind]||['特殊能力',1,'%'];let base=POWER[r.id%20]*[1,2.2,4.8,9.5,18][r.r]*mul;let lv=levelOf(r.id)||1;let amount=base*(1+(lv-1)*.22);let extra=r.kind==='soulDragon'?' / 転生ソウルにも効果':r.kind==='all'?' / HP・攻撃・防御などに反映':'';return name+' +'+amount.toFixed(2)+unit+'（Lv.'+lv+'時）'+extra+'。同種の効果は加算、Lvアップごとに基礎効果の22%増加。'}
function rewardText(v){return v.soul?'ソウル ×'+fmt(v.soul):RARITY[v.chest]+'以上宝箱 ×1'}
function exportSave(){save();let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='death_tower_v6_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importFile(el){let file=el.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.version!==6||!obj.level||!obj.relics)throw Error('Ver.6のバックアップではありません');if(!confirm('現在のデータを上書きします。よろしいですか？'))return;s={...fresh(),...obj};spawn();save();closePanel();titleUpdate();notice('バックアップを復元しました')}catch(e){alert('読み込み失敗: '+e.message)}};reader.readAsText(file)}
function resetGame(){if(!confirm('全セーブデータを削除します。よろしいですか？'))return;if(!confirm('この操作は取り消せません。本当に初期化しますか？'))return;s=fresh();spawn();save();closePanel();titleUpdate();notice('初期化しました')}
function showTitle(){closePanel();started=false;titleUpdate();document.getElementById('titleScreen').classList.remove('hidden')}
load();spawn();titleUpdate();draw();requestAnimationFrame(loop);window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();lastTick=performance.now()});document.addEventListener('pointerdown',e=>{if(e.target.closest('button:not(:disabled)'))sound(700,.04)},{passive:true});
</script></body></html>
