const fallbackSprite=sprite;
sprite=function(type){return assetFrames[type]?.idle[0]||fallbackSprite(type)};
let spriteTick=0;
const spriteActionUntil={hero:0,enemy:0};
function spriteStrike(which){spriteActionUntil[which]=performance.now()+390;}
function animateOfficialSprites(now){
 const tick=Math.floor(now/170);
 if(tick===spriteTick)return;
 spriteTick=tick;
 const current=foe(s.floor),next=foe(s.floor+1);
 for(const [id,type] of [['hero','hero'],['enemy',current.emoji],['nextEnemy',next.emoji]]){
  const a=assetFrames[type];if(!a)continue;
  const useAttack=id!=='nextEnemy'&&now<(spriteActionUntil[id]||0)&&a.attack.length;
  const frames=useAttack?a.attack:a.idle;
  const idx=useAttack?Math.min(frames.length-1,Math.floor((390-(spriteActionUntil[id]-now))/390*frames.length)):tick%frames.length;
  const node=$(id);const uri=frames[Math.max(0,idx)];
  if(node.src!==uri)node.src=uri;
 }
}

$('hero').src=sprite('hero');
function bonus(){let b={hp:0,atk:0,def:0,spd:0,crit:0,cdmg:0,dodge:0,soul:0,heal:0,drain:0,bossDmg:0,bossDef:0,death:0,travel:0,accel:0};for(let i=0;i<100;i++){let n=s.relics[i];if(!n||s.off.includes(i))continue;let r=relics[i],v=r.base*Math.sqrt(n),k=r.kind; if(k===0||k===8||k===12)b.hp+=v;else if(k===1||k===9||k===13)b.atk+=v;else if(k===2||k===10||k===14)b.def+=v;else if(k===3||k===11)b.spd+=v;else if(k===4)b.crit+=v;else if(k===5)b.cdmg+=v;else if(k===6||k===18)b.dodge+=v;else if(k===7||k===16)b.soul+=v;else if(k===15||k===17)b.death+=v;else if(k===19)b.travel+=v; if(k===8&&r.t>=2)b.heal+=Math.min(v,20)/10;if(k===9&&r.t>=3)b.drain+=Math.min(v,10)/10;if(k===10&&r.t>=3)b.bossDmg+=v;if(k===11&&r.t>=3)b.bossDef+=v;}return b}
function stats(){let b=bonus(),deathFactor=1+s.deaths*.01*(1+b.death/100);return {maxHp:Math.floor((100+s.level.hp*30)*(1+b.hp/100)*deathFactor),atk:Math.floor((25+s.level.atk*9)*(1+b.atk/100)*deathFactor),def:Math.floor((8+s.level.def*5)*(1+b.def/100)*deathFactor),spd:(1+s.level.spd*.06)*(1+b.spd/100),crit:Math.min(100,5+s.level.crit*1.5+b.crit),cdmg:150+s.level.cdmg*15+b.cdmg,dodge:Math.min(75,3+s.level.dodge*1.2+b.dodge),b}}
function foe(f){let boss=f%10===0,mega=f%100===0,scale=Math.pow(1.055,f-1);return {name:mega?'塔の支配者':boss?'深層の守護者':['骸骨兵','魔導士','キノコ魔物','スライム','骸骨の番人'][(f-1)%5],emoji:mega?'👹':boss?'🛡️':['💀','👤','🪨','👻','🗿'][(f-1)%5],hp:Math.round(48*scale*(mega?8:boss?3:1)),atk:Math.round(7*Math.pow(1.047,f-1)*(mega?2.3:boss?1.5:1)),def:Math.round(5*Math.pow(1.04,f-1)*(mega?1.8:boss?1.25:1)),spd:mega?1.2:boss?1:0.8,boss,mega,soul:Math.round((10+f*1.5)*Math.pow(1.025,f-1)*(mega?12:boss?4:1))}}
function startFloor(resetHp=false){let st=stats();if(resetHp||s.hp==null)s.hp=st.maxHp;let e=foe(s.floor);if(s.enemyHp==null)s.enemyHp=e.hp;accPlayer=accEnemy=accTime=0;render();save()}
function flash(t,crit=false){let el=$('damage');el.className='';void el.offsetWidth;el.textContent=t;el.className='show'+(crit?' crit':'')}
function attack(fromPlayer){spriteStrike(fromPlayer?'hero':'enemy');let st=stats(),e=foe(s.floor),timeBoost=accTime>15?1+(accTime-15)*.10*(1+st.b.accel/100):1;let miss=Math.random()*100<(fromPlayer?0:st.dodge);if(miss){if(displayTime>.17){flash('MISS');displayTime=0}return}let crit=fromPlayer&&Math.random()*100<st.crit;let power=fromPlayer?st.atk:e.atk;let def=fromPlayer?e.def:st.def;let damage=Math.max(1,Math.round(power*100/(100+def)*(.9+Math.random()*.2)*timeBoost*(crit?st.cdmg/100:1)*(fromPlayer&&e.boss?1+st.b.bossDmg/100:1)*(fromPlayer?1:Math.max(.05,1-st.b.bossDef/100))));if(fromPlayer){s.enemyHp-=damage;if(st.b.drain)s.hp=Math.min(st.maxHp,s.hp+Math.floor(damage*st.b.drain/100));}else s.hp-=damage;if(displayTime>.15||crit){flash(fmt(damage),crit);displayTime=0}if(s.enemyHp<=0&&fromPlayer)win();else if(s.hp<=0&&!fromPlayer)die()}
function win(){let e=foe(s.floor),b=bonus();s.pending+=Math.floor(e.soul*(1+b.soul/100));s.kills++;s.totalKills++;s.runKills++;if(s.floor%25===0&&!s.claimed.includes(s.floor)){s.claimed.push(s.floor);let pool=Math.min(100,20+20*Math.floor((s.floor-1)/25));let options=[];for(let i=0;i<pool;i++){let tier=Math.floor(i/20),weight=[60,25,10,4,1][tier];for(let w=0;w<weight;w++)options.push(i)}let id=options[Math.floor(Math.random()*options.length)];s.relics[id]++;s.lastRelic=id;}
let st=stats();s.hp=Math.min(st.maxHp,s.hp+Math.floor(st.maxHp*b.heal/100));s.floor++;s.worldBest=Math.max(s.worldBest,s.floor);s.best=Math.max(s.best,s.floor);s.runMax=Math.max(s.runMax,s.floor);s.enemyHp=null;accPlayer=accEnemy=accTime=0;startFloor();if(s.lastRelic!=null){let id=s.lastRelic;delete s.lastRelic;show('reward',id)}}
function die(){alive=false;s.hp=0;s.deaths++;s.totalDeaths++;s.souls+=s.pending;s.lastPayout=s.pending;s.pending=0;s.enemyHp=null;save();show('death')}
function resume(){let c=s.activeCheckpoint||0;s.floor=c||1;s.runKills=0;s.runMax=s.floor;s.runStart=Date.now();s.enemyHp=null;alive=true;hide();startFloor(true)}
function show(view,data=null){panel=view;selected=data;$('overlay').classList.remove('hidden');$('closePanel').classList.toggle('hidden',view==='death'||view==='reward');drawPanel()}function hide(){if(panel==='death'||panel==='reward')return;panel='';$('overlay').classList.add('hidden');render()}
function drawPanel(){let title='',html='',foot='';const st=stats();if(panel==='death'){title='YOU DIED';html=`<div class="deathnum">💀 DEATH #${s.deaths}</div><div class="records" style="text-align:center">到達階層：${s.runMax}F<br>今回撃破：${s.runKills}体<br>獲得ソウル：<b style="color:#ffd36c">+${fmt(s.lastPayout||0)}</b><br>死亡成長：基本能力 +1%（累計 ${s.deaths}%）</div><div class="notice">ソウルを使って強化してから再挑戦できます。</div>`;foot='<button class="action" style="width:100%" id="deathUpgrade">ステータス強化</button><button class="action" style="width:100%;margin-top:6px" id="retry">再挑戦</button>'}
else if(panel==='upgrade'){title='SOUL UPGRADE';let labels={hp:'最大HP',atk:'攻撃力',def:'防御力',spd:'攻撃速度',crit:'会心率',cdmg:'会心倍率',dodge:'回避率'};html=`<div class="row"><b>所持ソウル：${fmt(s.souls)}</b><span class="sub">死亡 ${s.deaths}回</span></div><div class="upgradegrid">${Object.keys(labels).map(k=>{let lv=s.level[k],cost=Math.floor(20*Math.pow(1.35,lv)*(k==='crit'||k==='dodge'?1.7:1));return `<button data-up="${k}" ${s.souls<cost?'disabled':''}><b>${labels[k]}</b>Lv.${lv}<br>必要 ${fmt(cost)} SOUL</button>`}).join('')}</div><div class="notice">強化は現在の世界のみ有効です。ソウルは死亡時に精算されます。</div>`;foot=alive?'':'<button class="action" style="width:100%" id="backDeath">死亡画面へ戻る</button>'}
else if(panel==='relic'){title='RELIC CODEX';html=`<div class="row"><span class="sub">収集 ${s.relics.filter(Boolean).length}/100種類</span><span class="sub">アイコンをタップして詳細表示</span></div><div class="codex">${relics.map((r,i)=>`<button class="slot ${s.relics[i]?'owned':''}" data-relic="${i}" data-count="${s.relics[i]>1?'×'+s.relics[i]:''}" style="color:${s.relics[i]?colors[r.t]:'#534b60'};border-color:${s.relics[i]?colors[r.t]:'#383042'}">${s.relics[i]?r.icon:'?'}</button>`).join('')}</div><div class="row" style="font-size:10px">${rarities.map((r,i)=>`<span style="color:${colors[i]}">●${r.slice(0,1)}</span>`).join('')}</div><div class="notice">未入手は「?」表示。レリックは25階ごとの初回踏破報酬です。</div>`}
else if(panel==='detail'||panel==='reward'){let id=selected,r=relics[id],n=s.relics[id],v=r.base*Math.sqrt(n);title=panel==='reward'?'RELIC GET!':'RELIC DETAIL';html=`<div style="text-align:center;font-size:58px;color:${colors[r.t]}">${r.icon}</div><div style="text-align:center"><b>${esc(r.name)}</b><div style="color:${colors[r.t]};font-size:12px">${rarities[r.t]}</div></div><div class="detail"><div>所持数：${n}個</div><div>効果：${esc(effect(r))}</div><div>重複補正：×${Math.sqrt(n).toFixed(2)}（試作計算）</div><div>状態：${s.off.includes(id)?'OFF':'ON'}</div></div><button class="mini" id="toggleRelic">${s.off.includes(id)?'ONにする':'OFFにする'}</button>`;foot=`<button class="action" style="width:100%" id="${panel==='reward'?'rewardOk':'backCodex'}">${panel==='reward'?'冒険に戻る':'図鑑へ戻る'}</button>`}
else if(panel==='rebirth'){title='WORLD REBIRTH';html=`<div class="records">現在：第${s.world}世界<br>現在世界の最高階層：${s.worldBest}F<br>世界転生回数：${s.rebirths}回</div><div class="notice">100階突破後に世界転生できます。レリックと総合記録は引き継ぎます。ソウル・強化・死亡成長・チェックポイントはリセットされます。</div><button class="action" id="doRebirth" ${s.worldBest<101?'disabled':''}>${s.worldBest>=101?'世界転生する':'100F突破で解放'}</button><div class="sub">チェックポイント（ソウルで購入、到達済みのみ）</div><div class="checkpointgrid">${[10,25,50,75,100,150].map(f=>{let got=s.checkpoints.includes(f),cost=f*12;return `<button data-check="${f}" class="${s.activeCheckpoint===f?'on':''}" ${s.worldBest<=f?'disabled':''}>${f}F<br>${got?(s.activeCheckpoint===f?'使用中':'切替'):'購入 '+cost}</button>`}).join('')}</div><button class="mini" id="checkOff">チェックポイントをすべてOFF</button>`}
else if(panel==='records'){title='RECORDS';html=`<div class="records">現在の世界：${s.world}<br>現在世界の死亡：${s.deaths}回<br>現在世界の最高：${s.worldBest}F<br>総死亡回数：${s.totalDeaths}回<br>総撃破数：${s.totalKills}体<br>歴代最高階層：${s.best}F<br>世界転生：${s.rebirths}回<br>レリック収集：${s.relics.filter(Boolean).length}/100</div><div class="sub">過去の世界</div><div class="records">${s.history.length?s.history.slice(-5).reverse().map(h=>`第${h.world}世界：最高${h.best}F / 死亡${h.deaths}回`).join('<br>'):'まだ転生記録はありません。'}</div><div class="notice">試作品のため、記録項目は今後拡張予定です。</div>`}
$('panelTitle').textContent=title;$('panelContent').innerHTML=html;$('panelFooter').innerHTML=foot;}
function effect(r){let kind=r.kind,v=r.base;let descriptions=['最大HP +','攻撃力 +','防御力 +','攻撃速度 +','会心率 +','会心倍率 +','回避率 +','ソウル獲得量 +','最大HP強化 +','攻撃力強化 +','防御力強化 +','攻撃速度強化 +','最大HP強化 +','攻撃力強化 +','防御力強化 +','死亡成長補正 +','ソウル獲得補正 +','死亡成長補正 +','回避率強化 +','階層移動短縮 +'];return descriptions[kind]+v+(kind===4||kind===5||kind===6||kind===18?'ポイント':'%')+'（基本値）'}
function render(){let st=stats(),e=foe(s.floor),n=foe(s.floor+1);$('world').textContent='WORLD '+s.world;$('souls').textContent=fmt(s.souls);$('runSouls').textContent='未精算 '+fmt(s.pending);$('floor').textContent='BATTLE — '+s.floor+'F';$('nextFloor').textContent='NEXT — '+(s.floor+1)+'F';if($('enemy').dataset.kind!==e.emoji){$('enemy').src=sprite(e.emoji);$('enemy').dataset.kind=e.emoji}if($('nextEnemy').dataset.kind!==n.emoji){$('nextEnemy').src=sprite(n.emoji);$('nextEnemy').dataset.kind=n.emoji}$('enemyName').textContent=e.name;$('nextName').textContent=n.name;$('nextType').textContent=n.mega?'大ボス':n.boss?'BOSS':'ENEMY';$('battleType').textContent=e.mega?'大ボス':e.boss?'BOSS':'AUTO';$('enemyHpText').textContent=fmt(Math.max(0,s.enemyHp??e.hp))+'/'+fmt(e.hp);$('enemyBar').style.width=Math.max(0,100*(s.enemyHp??e.hp)/e.hp)+'%';$('hpText').textContent=fmt(Math.max(0,s.hp??st.maxHp))+'/'+fmt(st.maxHp);$('hpBar').style.width=Math.max(0,100*(s.hp??st.maxHp)/st.maxHp)+'%';$('atkText').textContent=fmt(st.atk);$('defText').textContent=fmt(st.def);$('critText').textContent=st.crit.toFixed(1)+'%';$('dodgeText').textContent=st.dodge.toFixed(1)+'%';$('status').textContent=alive?'自動戦闘中':'死亡・強化待ち';document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===s.speed));}
function clickAction(e){let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.speed){s.speed=Number(d.speed);render();save();return}if(d.view){if(d.view==='battle'){if(panel!=='death'&&panel!=='reward'){panel='';$('overlay').classList.add('hidden')}}else show(d.view);return}if(d.up){let k=d.up,lv=s.level[k],cost=Math.floor(20*Math.pow(1.35,lv)*(k==='crit'||k==='dodge'?1.7:1));if(s.souls>=cost){s.souls-=cost;s.level[k]++;let st=stats();s.hp=Math.min(st.maxHp,(s.hp||0)+(k==='hp'?30:0));save();drawPanel();render()}return}if(d.relic!==undefined){selected=Number(d.relic);if(!s.relics[selected])return;panel='detail';drawPanel();return}if(d.check){let f=Number(d.check),cost=f*12;if(s.worldBest<=f)return;if(!s.checkpoints.includes(f)){if(s.souls<cost)return;s.souls-=cost;s.checkpoints.push(f)}s.activeCheckpoint=s.activeCheckpoint===f?0:f;save();drawPanel();render();return}switch(b.id){case'closePanel':hide();break;case'deathUpgrade':show('upgrade');break;case'backDeath':show('death');break;case'retry':resume();break;case'toggleRelic':{let id=selected;if(s.off.includes(id))s.off=s.off.filter(i=>i!==id);else s.off.push(id);save();drawPanel();render();break}case'backCodex':show('relic');break;case'rewardOk':panel='';$('overlay').classList.add('hidden');break;case'checkOff':s.activeCheckpoint=0;save();drawPanel();break;case'doRebirth':if(s.worldBest<101)return;if(!confirm('第'+s.world+'世界を終了して転生しますか？ ソウルと強化はリセットされます。'))return;s.history.push({world:s.world,best:s.worldBest,deaths:s.deaths,kills:s.kills});let old=s;s=blank();s.world=old.world+1;s.rebirths=old.rebirths+1;s.relics=old.relics;s.off=old.off;s.history=old.history;s.best=old.best;s.totalDeaths=old.totalDeaths;s.totalKills=old.totalKills;alive=true;panel='';$('overlay').classList.add('hidden');startFloor(true);break}}
document.addEventListener('click',clickAction);document.addEventListener('visibilitychange',()=>{last=performance.now();save()});window.addEventListener('pagehide',save);function loop(now){animateOfficialSprites(now);let dt=Math.min(.1,(now-last)/1000);last=now;if(!document.hidden&&alive&&panel!=='death'&&panel!=='reward'){let step=dt*s.speed,st=stats(),e=foe(s.floor);accTime+=step;accPlayer+=step*st.spd;accEnemy+=step*e.spd;displayTime+=dt;let count=0;while((accPlayer>=1||accEnemy>=1)&&count++<60&&alive){if(accPlayer>=1){accPlayer--;attack(true)}if(alive&&accEnemy>=1){accEnemy--;attack(false)}}}if(now-lastSave>150){render();lastSave=now}if(now%5000<90)save();requestAnimationFrame(loop)}startFloor();if(s.hp<=0){alive=false;show('death')}requestAnimationFrame(loop);
</script></body></html>
